<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card pip preview</title>
<!-- Served under the app's CSP (no inline style/script), so this page is
     deliberately plain HTML: img width attributes only. -->
</head>
<body bgcolor="#123326" text="#eeeeee">
  <h3>Club vs spade at 35px (the distinguishability test)</h3>
  <p>
    <img src="images/cards/6C.svg?preview" width="35" alt="6C">
    <img src="images/cards/7C.svg?preview" width="35" alt="7C">
    <img src="images/cards/6S.svg?preview" width="35" alt="6S">
    <img src="images/cards/7S.svg?preview" width="35" alt="7S">
  </p>
  <h3>Same at 46px</h3>
  <p>
    <img src="images/cards/6C.svg?preview" width="46" alt="6C">
    <img src="images/cards/7C.svg?preview" width="46" alt="7C">
    <img src="images/cards/6S.svg?preview" width="46" alt="6S">
    <img src="images/cards/7S.svg?preview" width="46" alt="7S">
  </p>
  <h3>All four suits, 6s and 7s, 35px</h3>
  <p>
    <img src="images/cards/6H.svg?preview" width="35" alt="6H">
    <img src="images/cards/7H.svg?preview" width="35" alt="7H">
    <img src="images/cards/6D.svg?preview" width="35" alt="6D">
    <img src="images/cards/7D.svg?preview" width="35" alt="7D">
    <img src="images/cards/6C.svg?preview" width="35" alt="6C">
    <img src="images/cards/7C.svg?preview" width="35" alt="7C">
    <img src="images/cards/6S.svg?preview" width="35" alt="6S">
    <img src="images/cards/7S.svg?preview" width="35" alt="7S">
  </p>
  <h3>Corner-index strip check (what an overlapped fan shows): 10s, aces, faces at 40px</h3>
  <p>
    <img src="images/cards/10C.svg?preview" width="40" alt="10C">
    <img src="images/cards/10S.svg?preview" width="40" alt="10S">
    <img src="images/cards/AC.svg?preview" width="40" alt="AC">
    <img src="images/cards/AS.svg?preview" width="40" alt="AS">
    <img src="images/cards/JC.svg?preview" width="40" alt="JC">
    <img src="images/cards/QS.svg?preview" width="40" alt="QS">
    <img src="images/cards/KS.svg?preview" width="40" alt="KS">
    <img src="images/cards/KC.svg?preview" width="40" alt="KC">
  </p>
  <h3>Large: 8♣ and 8♠ at 120px</h3>
  <p>
    <img src="images/cards/8C.svg?preview" width="120" alt="8C">
    <img src="images/cards/8S.svg?preview" width="120" alt="8S">
  </p>
</body>
</html>
